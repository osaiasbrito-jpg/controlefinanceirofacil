[build]
  publish = "dist"
  command = "npm run build"

# Proxy transparente para que as chamadas /api/* do Netlify atinjam o servidor Node.js/PostgreSQL no Cloud Run
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-ca2j6yzl6qm4otgueyocuu-440149738355.us-east1.run.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
